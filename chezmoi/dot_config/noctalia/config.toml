[accessibility]
ui_scale = 1.0

[bar]
order = [ "main" ]

    [bar.main]
    background_opacity = 0.79999998211860657
    capsule_thickness = 0.99999998137354851
    center = [ "media", "workspaces", "cat" ]
    concave_edge_corners = false
    end = [ "tray", "notifications", "battery", "volume", "brightness", "clock" ]
    font_weight = 400
    margin_edge = 0
    margin_ends = 300
    padding = 25
    position = "bottom"
    radius = 12
    scale = 1.1000000089406967
    shadow = true
    start = [ "nix-monitor", "sysmon", "cpu" ]
    thickness = 25
    widget_spacing = 12

[brightness]
enable_ddcutil = true

[dock]
background_opacity = 0.79999998211860657
item_spacing = 12

[idle.behavior.lock]
action = "lock"
enabled = true
timeout = 200

[idle.behavior.screen-off]
action = "screen_off"
enabled = true
timeout = 120

[location]
address = "Nages-et-Solorgues"

[lockscreen]
blur_intensity = 0.99999997764825821

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [
    "lockscreen-login-box@HEADLESS-1",
    "lockscreen-login-box@HDMI-A-1",
    "lockscreen-login-box@DP-3",
    "lockscreen-widget-0000000000000001",
    "lockscreen-widget-0000000000000002",
    "lockscreen-widget-0000000000000003",
    "lockscreen-widget-0000000000000004"
]

    [lockscreen_widgets.grid]
    cell_size = 64
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-3"]
    box_height = 70.0
    box_width = 400.0
    cx = 1433.5
    cy = 600.0
    output = "DP-3"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-3".settings]
        background_color = "surface_variant"
        background_opacity = 0.0
        background_radius = 12.0
        center_password_text = true
        input_opacity = 1.0
        input_radius = 6.0
        layout = "compact"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = false
        show_session_buttons = false
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1"]
    box_height = 196.0
    box_width = 720.0
    cx = 960.0
    cy = 961.0
    output = "HDMI-A-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@HEADLESS-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 480.0
    cy = 358.0
    output = "HEADLESS-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HEADLESS-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000001]
    box_height = 192.0
    box_width = 576.0
    cx = 1433.5
    cy = 376.0
    output = "DP-3"
    rotation = 0.0
    type = "clock"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000001.settings]
        background = false
        center_text = true
        clock_style = "digital"
        color = "on_primary"
        format = "{:%H:%M}"
        shadow = false

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000002]
    box_height = 0.0
    box_width = 0.0
    cx = 1433.5
    cy = 796.0
    output = "DP-3"
    rotation = 0.0
    type = "media_player"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000002.settings]
        background = false
        hide_when_no_media = true
        shadow = false

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000003]
    box_height = 128.0
    box_width = 208.0
    cx = 1433.5
    cy = 1048.0
    output = "DP-3"
    rotation = 0.0
    type = "sysmon"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000003.settings]
        background = false
        display = "graph"
        shadow = false
        show_label = true
        stat = "cpu_usage"
        stat2 = "cpu_temp"

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000004]
    box_height = 64.0
    box_width = 384.0
    cx = 1433.5
    cy = 472.0
    output = "DP-3"
    rotation = 0.0
    type = "clock"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000004.settings]
        background = false
        center_text = true
        clock_style = "digital"
        color = "on_error"
        format = "{:%A %d %B } "
        shadow = false

[nightlight]
temperature_day = 6500
temperature_night = 4000

[notification]
background_opacity = 0.79999998211860657
position = "bottom_center"

[osd]
background_opacity = 0.79999998211860657
orientation = "vertical"
position = "bottom_right"
position_vertical = "center_right"

    [osd.kinds]
    media = false

[plugin_settings."avivbintangaringga/nix-monitor"]
branch = "nixos-26.05"

[plugin_settings."nzlov/daily-wallpaper"]
locale = "fr-FR"

[plugins]
enabled = [ "nzlov/daily-wallpaper", "dotnetrob/cat", "avivbintangaringga/nix-monitor" ]

[shell]
avatar_path = "/home/volodia/Pictures/.face"
launch_apps_as_systemd_services = true
polkit_agent = true
screen_time_enabled = true
settings_show_advanced = true
telemetry_enabled = false

    [shell.animation]
    enabled = true

    [shell.panel]
    open_near_click_control_center = true
    open_near_click_session = true
    session_position = "center"
    transparency_mode = "glass"

    [shell.session]
    grid_columns = 5

        [[shell.session.actions]]
        action = "lock"
        countdown_seconds = 0.0
        enabled = true
        shortcut = "1"
        variant = "default"

        [[shell.session.actions]]
        action = "logout"
        countdown_seconds = 0.0
        enabled = true
        shortcut = "2"
        variant = "default"

        [[shell.session.actions]]
        action = "lock_and_suspend"
        countdown_seconds = 0.0
        enabled = true
        shortcut = "3"
        variant = "default"

        [[shell.session.actions]]
        action = "reboot"
        countdown_seconds = 0.0
        enabled = true
        shortcut = "4"
        variant = "default"

        [[shell.session.actions]]
        action = "command"
        command = "systemctl hibernate"
        countdown_seconds = 0.0
        enabled = true
        label = "Hibernation"
        variant = "secondary"

        [[shell.session.actions]]
        action = "shutdown"
        countdown_seconds = 0.0
        enabled = true
        shortcut = "5"
        variant = "destructive"

    [shell.shadow]
    direction = "center"

[theme]
builtin = "Catppuccin"
mode = "dark"
source = "builtin"

[wallpaper]
directory = "/home/volodia/Pictures/Wallpapers"
enabled = true
fill_color = "#000000"
fill_mode = "crop"
transition = [ "fade", "disc", "stripes", "wipe", "honeycomb" ]
transition_duration = 1500
transition_on_startup = true

    [wallpaper.default]
    path = "/home/volodia/Pictures/Wallpapers/daily-wallpaper/bing-fr-fr-2026-08-18.jpg"

    [wallpaper.last]
    path = "/home/volodia/Pictures/Wallpapers/daily-wallpaper/bing-fr-fr-2026-08-18.jpg"

    [wallpaper.monitors.DP-3]
    path = "/home/volodia/Pictures/Wallpapers/daily-wallpaper/bing-fr-fr-2026-08-18.jpg"

    [wallpaper.monitors.HDMI-A-1]
    path = "/home/volodia/Pictures/Wallpapers/daily-wallpaper/bing-fr-fr-2026-08-12.jpg"

    [wallpaper.monitors.HEADLESS-1]
    path = "/home/volodia/Pictures/Wallpapers/daily-wallpaper/bing-fr-fr-2026-08-18.jpg"

[weather]
effects = true
enabled = true

[widget.cat]
cat_size = 32
type = "dotnetrob/cat:cat"
walk_threshold = 20

    [widget.cat.actions]
    left = "panel-toggle control-center system"

[widget.clock]
format = "{:%H:%M %A %d %B } "
tooltip_format = "{:%H:%M %a, %b %d}"

[widget.control-center]
glyph = "snowflake"

[widget.cpu]
stat = "cpu_temp"
visualization = "none"

[widget.media]
album_art_only = true
art_size = 20

[widget.nix-monitor]
checking_color = "secondary"
type = "avivbintangaringga/nix-monitor:nix-monitor"
up_to_date_color = "tertiary"
update_available_color = "error"

[widget.sysmon]
show_glyph = true
show_value = true
stat = "disk_free"
visualization = "none"

[widget.workspaces]
anchor = true
labels_only_when_occupied = true
