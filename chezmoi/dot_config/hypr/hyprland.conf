# Hyprland configuration
# Migrated from niri — keeps scrolling WM, all keybinds, and all settings.

$mod = SUPER

#─────────────────────────────
# Input
#─────────────────────────────
input {
    kb_layout = fr
    # follow_mouse = 1
    scroll_method = 2fg
    accel_profile = flat

    touchpad {
        natural_scroll = true
        scroll_factor = 0.1
        tap-to-click = true
        disable_while_typing = true
    }
}

#─────────────────────────────
# General / layout
#─────────────────────────────
general {
    gaps_in = 6
    gaps_out = 12
    layout = scrolling
    allow_tearing = false

    # Noctalia theme colors (from chezmoi/dot_config/niri/noctalia.kdl)
    col.active_border = rgba(805600ff)
    # col.inactive_border = rgba(fff8f3ff)
}

#─────────────────────────────
# Scrolling layout (native in hyprland core since mid-2025)
#─────────────────────────────
scrolling {
    fullscreen_on_one_column = true
    focus_fit_method = 1
    follow_focus = true
    follow_min_visible = 0.4
    wrap_focus = true
    wrap_swapcol = true
}

#─────────────────────────────
# Monitors
#─────────────────────────────
monitor = DP-3, 3440x1440@143.92, 0x0, 1.25
monitor = HDMI-A-1, 640x480@59.95, auto, 1, mirror, DP-3
#─────────────────────────────
# Workspace names (mapped to numbered workspaces)
#─────────────────────────────
workspace = 1, name:browser
workspace = 2, name:terminal
workspace = 3, name:social
workspace = 4, name:fizzy
workspace = 5, name:misc
workspace = 6, name:music
workspace = 7, name:zotero
workspace = 8, name:misc2
workspace = 9, name:misc3

#─────────────────────────────
# Autostart
#─────────────────────────────
exec-once = swayidle -w before-sleep "noctalia msg session lock"
exec-once = noctalia

#─────────────────────────────
# Cursor
#─────────────────────────────
cursor {
    sync_gsettings_theme = true
    # no_hardware_cursors = 2
}

env = XCURSOR_SIZE,18

#─────────────────────────────
# Animations
#─────────────────────────────
animations {
    enabled = false
}

#─────────────────────────────
# Gestures (disable workspace swipe; no hot corners in hyprland)
#─────────────────────────────
gestures {
}

#─────────────────────────────
# Decoration
#─────────────────────────────
decoration {
    rounding = 12
    active_opacity = 1.0
    inactive_opacity = 1.0

    blur {
        enabled = true
        passes = 5
        noise = 0.05
        vibrancy = 0.8
        xray = false
        new_optimizations = true
        ignore_opacity = false
    }

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }
}

#─────────────────────────────
# Binds
#─────────────────────────────
# Window management
bind = $mod, Space, exec, fuzzel
bind = $mod SHIFT, E, exit

# Window focus (scrolling layout)
bind = $mod, H, movefocus, l
bind = $mod, L, movefocus, r
bind = $mod, K, movefocus, u
bind = $mod, J, movefocus, d

# Window movement (scrolling layout)
bind = $mod, Left, layoutmsg, swapcol l
bind = $mod, Right, layoutmsg, swapcol r
bind = $mod, Up, movewindow, u
bind = $mod, Down, movewindow, d

# Window actions
bind = $mod, Q, killactive
bind = $mod, F, layoutmsg, colresize 1.0
bind = $mod SHIFT, F, layoutmsg, colresize 0.5
# bind = $mod SHIFT, F, fullscreen, 0
bind = $mod CTRL SHIFT, F, fullscreenstate, 2

# Workspaces (French AZERTY keysyms)
bind = $mod, ampersand, workspace, 1
bind = $mod, eacute, workspace, 2
bind = $mod, quotedbl, workspace, 3
bind = $mod, apostrophe, workspace, 4
bind = $mod, parenleft, workspace, 5
bind = $mod, minus, workspace, 6
bind = $mod, egrave, workspace, 7
bind = $mod, underscore, workspace, 8
bind = $mod, ccedilla, workspace, 9
bind = $mod, agrave, workspace, 10

bind = $mod SHIFT, ampersand, movetoworkspace, 1
bind = $mod SHIFT, eacute, movetoworkspace, 2
bind = $mod SHIFT, quotedbl, movetoworkspace, 3
bind = $mod SHIFT, apostrophe, movetoworkspace, 4
bind = $mod SHIFT, parenleft, movetoworkspace, 5
bind = $mod SHIFT, minus, movetoworkspace, 6
bind = $mod SHIFT, egrave, movetoworkspace, 7
bind = $mod SHIFT, underscore, movetoworkspace, 8
bind = $mod SHIFT, ccedilla, movetoworkspace, 9
bind = $mod SHIFT, agrave, movetoworkspace, 10

# Screenshot
bind = $mod SHIFT, S, exec, grim -g "$(slurp -c '#ff0000ff')" -t ppm - | satty --filename - --output-filename ~/Pictures/satty-$(date '+%Y%m%d-%H%M:%S').png
bind = , Print, exec, grim - | wl-copy

# Lock screen
bind = $mod, Escape, exec, noctalia msg session lock

# Scratchpad (replaces nirius toggle-follow-mode)
bind = $mod, P, togglespecialworkspace, scratch

# VRR toggle (per-monitor)
bind = $mod, Tab, exec, hyprctl keyword monitor "Iiyama North America PL3461WQ 1171803800833",preferred,auto,1,vrr,1
bind = $mod SHIFT, Tab, exec, hyprctl keyword monitor "Iiyama North America PL3461WQ 1171803800833",preferred,auto,1,vrr,0

# Volume control
bindl = , XF86AudioRaiseVolume, exec, noctalia msg volume-up
bindl = , XF86AudioLowerVolume, exec, noctalia msg volume-down
bindl = , XF86AudioMute, exec, noctalia msg volume-mute

# Brightness control
bindl = , XF86MonBrightnessUp, exec, noctalia msg brightness-up
bindl = , XF86MonBrightnessDown, exec, noctalia msg brightness-down

# Media control
bindl = , XF86AudioNext, exec, noctalia msg media next
bindl = , XF86AudioPrev, exec, noctalia msg media previous
bindl = , XF86AudioPlay, exec, noctalia msg media toggle

# Keyboard brightness
bindl = , XF86KbdBrightnessUp, exec, brightnessctl --device kbd_backlight set 10%+
bindl = , XF86KbdBrightnessDown, exec, brightnessctl --device kbd_backlight set 10%-

#─────────────────────────────
# Window rules
#─────────────────────────────
# Workspace assignments
windowrule = match:class ^(brave-browser)$, workspace 1
windowrule = match:class ^(kitty)$, workspace 2
windowrule = match:class ^(kitty)$, fullscreen_state 1
windowrule = match:title ^(.*Proton Mail.*)$, workspace 3
windowrule = match:title ^(.*Fizzy.*|.*Home Assistant.*)$, workspace 4
windowrule = match:class ^(io.github.nokse22.high-tide)$, workspace 6
windowrule = match:class ^(io.github.nokse22.high-tide)$, fullscreen_state 1
windowrule = match:class ^(Zotero)$, workspace 7
windowrule = match:class ^(Zotero)$, fullscreen_state 1
windowrule = match:class ^(signal|legcord)$, workspace 3

# Picture-in-Picture (floating, bottom-right, 480x270, 80% opacity)
windowrule = match:title ^(Picture-in-Picture)$, float on
windowrule = match:title ^(Picture-in-Picture)$, size 480 270
windowrule = match:title ^(Picture-in-Picture)$, opacity 0.8 0.8

# Global blur (matches niri's global background-effect rule)
windowrule = match:class ^(.*)$, no_blur off

# Block out from screen capture
windowrule = match:class ^(org.keepassxc.KeePassXC|org.gnome.World.Secrets|signal)$, no_screen_share on
windowrule = match:title ^(.*Proton Mail.*|mail|Bitwarden)$, no_screen_share on

# VRR for games
windowrule = match:class ^(mpv|steam_app_.*)$, no_vrr off
windowrule = match:class (.*\.exe)$, no_vrr off

#─────────────────────────────
# Layer rules
#─────────────────────────────
# Block out from screen capture
layerrule = match:namespace ^(notifications|noctalia-wallpaper.*|noctalia-bar-exclusion.*)$, no_screen_share on

# Blur for launcher
layerrule = match:namespace ^(launcher)$, blur on
layerrule = match:namespace ^(launcher)$, xray 0

# Noctalia surfaces — blur, no xray, block from capture
layerrule = match:namespace ^(noctalia-(bar-[^"]+|notification|dock|panel|attached-panel|osd|window-switcher))$, blur on
layerrule = match:namespace ^(noctalia-(bar-[^"]+|notification|dock|panel|attached-panel|osd|window-switcher))$, xray 0
layerrule = match:namespace ^(noctalia-(bar-[^"]+|notification|dock|panel|attached-panel|osd|window-switcher))$, no_screen_share on
