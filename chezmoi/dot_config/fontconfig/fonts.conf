<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Ported from modules/nixos/desktop.nix `fonts.fontconfig.defaultFonts`
  (PLAN.MD task 3.3). Verified against the actual attrset, not just the
  plan's prose:

    monospace -> "Comic Code Ligatures"
    sansSerif -> "Inter"
    serif     -> "IBM Plex Serif"

  Comic Code Ligatures itself is not installed by this file — it ships
  per-user via chezmoi into ~/.local/share/fonts (see task 3.3 notes on the
  transcrypt-encrypted source; not yet wired up, see migration report).
-->
<fontconfig>
  <alias>
    <family>monospace</family>
    <prefer>
      <family>Comic Code Ligatures</family>
    </prefer>
  </alias>

  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Inter</family>
    </prefer>
  </alias>

  <alias>
    <family>serif</family>
    <prefer>
      <family>IBM Plex Serif</family>
    </prefer>
  </alias>
</fontconfig>
