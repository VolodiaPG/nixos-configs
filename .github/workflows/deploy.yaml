name: Deploy Config

on:
  push:
    branches:
      - "main"
  check_suite:
    types: [completed]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04

    steps:
      - uses: wimpysworld/nothing-but-nix@main
        with:
          hatchet-protocol: "holster"

      - name: Create nix daemon tmpdir path
        run: |
          sudo mkdir -p /nix/tmpdir
          sudo chown "$(whoami)" /nix/tmpdir

      - uses: DeterminateSystems/determinate-nix-action@v3
        with:
          extra-conf: |
            lazy-trees = true
            experimental-features = nix-command flakes
            extra-experimental-features = nix-command flakes
            log-lines = 50
            build-dir = /nix/tmpdir
            accept-flake-config = true

      - name: Checkout repository
        uses: actions/checkout@main
        with:
          fetch-depth: 0

      - name: Tailscale
        uses: tailscale/github-action@main
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      # skipPush: pushing is done by static/cachix-push.sh below, which applies the
      # same ignore patterns / closure size limit as the post-build-hook on the hosts
      # (see modules/nixos/common-nix-settings.nix).
      - uses: cachix/cachix-action@v15
        with:
          name: volodiapg
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
          skipPush: true

      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_KEY }}
          known_hosts: ${{ secrets.KNOWN_HOSTS }}
          if_key_exists: fail # replace / ignore / fail; optional (defaults to fail)

      # - m1
      - name: Build packages for msi
        run: |
          set -euxo pipefail
          nix develop .#ci -c just ci msi

      - name: Build packages for home-server
        run: |
          set -euxo pipefail
          nix develop .#ci -c just ci home-server

      - name: Push to cachix
        env:
          CACHIX_NAME: volodiapg
          IGNORE_PATTERNS: "source etc system home-manager user-environment volodia"
          MAX_SIZE: 524288000 # 500 MB
        run: |
          set -euo pipefail
          # Only push what this job actually built from source. Everything
          # else in the closure was substituted from an upstream cache
          # (cache.nixos.org, nix-community, ...) and re-uploading it to our
          # own cache would just be wasted bandwidth/storage. `nix build`
          # prints its plan up front as "these N derivations will be
          # built:" / "these N paths will be fetched:" blocks (see
          # ./justfile's `ci` recipe for where build-log-*.txt comes from);
          # piped, not exported: a whole closure listing blows past the
          # 128 KB execve limit on a single environment string; xargs (not a
          # bare arg list) keeps us under ARG_MAX too since this can be
          # thousands of store paths
          awk '
            /^(this derivation|these [0-9]+ derivations) will be built:/ { building = 1; next }
            /^(this path|these [0-9]+ paths) will be fetched/ { building = 0 }
            building { print $1 }
          ' ./build-log-*.txt \
            | sort -u \
            | xargs -r nix-store -q --outputs \
            | sort -u \
            | ./static/cachix-push.sh

      - name: Build and deploy
        run: |
          set -euxo pipefail
          nix develop .#ci -c just deploy
