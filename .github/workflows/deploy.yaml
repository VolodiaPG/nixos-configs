name: Deploy Config

on:
  push:
    branches:
      - "main"
  check_suite:
    types: [completed]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04

    steps:
      - uses: wimpysworld/nothing-but-nix@main
        with:
          hatchet-protocol: "holster"

      - name: Create nix daemon tmpdir path
        run: |
          sudo mkdir -p /nix/tmpdir
          sudo chown "$(whoami)" /nix/tmpdir

      - uses: DeterminateSystems/determinate-nix-action@v3
        with:
          extra-conf: |
            lazy-trees = true
            experimental-features = nix-command flakes
            extra-experimental-features = nix-command flakes
            log-lines = 50
            build-dir = /nix/tmpdir
            accept-flake-config = true

      - name: Checkout repository
        uses: actions/checkout@main
        with:
          fetch-depth: 0

      - name: Tailscale
        uses: tailscale/github-action@main
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      # skipPush: `just ci` pushes itself, straight from nix-fast-build's
      # --cachix-cache as each package finishes building (see justfile).
      # This action only wires up CACHIX_AUTH_TOKEN and volodiapg as a
      # substituter, so --skip-cached can see what's already cached there.
      - uses: cachix/cachix-action@v15
        with:
          name: volodiapg
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
          skipPush: true

      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_KEY }}
          known_hosts: ${{ secrets.KNOWN_HOSTS }}
          if_key_exists: fail # replace / ignore / fail; optional (defaults to fail)

      # - m1
      - name: Build packages for msi
        run: |
          set -euxo pipefail
          nix develop .#ci -c just ci msi

      - name: Build packages for home-server
        run: |
          set -euxo pipefail
          nix develop .#ci -c just ci home-server

      - name: Build and deploy
        run: |
          set -euxo pipefail
          nix develop .#ci -c just deploy
