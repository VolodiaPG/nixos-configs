name: Ansible

on:
  push:
    paths:
      - "ansible/**"
      - ".github/workflows/ansible.yaml"
  pull_request:
    paths:
      - "ansible/**"
      - ".github/workflows/ansible.yaml"
  workflow_dispatch:

# This workflow covers the MIGRATED hosts only. deploy.yaml still builds and
# deploys home-server from the flake and must be left alone (PLAN.MD rule 1);
# its msi build/cachix job is removed in phase 7, not here.
jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@main

      - name: Install ansible
        run: pipx install ansible-core && pipx install ansible-lint

      - name: Create dummy vault password file
        # ansible.cfg sets vault_password_file. Ansible hard-fails every
        # command, even --syntax-check, when that path doesn't exist — CI
        # doesn't need real secrets, just a file to point at; wrong content
        # is fine since neither syntax-check nor lint decrypts the vault.
        run: |
          mkdir -p ~/.config/ansible
          echo "ci-dummy-password" > ~/.config/ansible/vault-pass
          chmod 0600 ~/.config/ansible/vault-pass

      - name: Syntax check
        working-directory: ansible
        run: |
          set -euxo pipefail
          for p in playbooks/*.yml; do
            ansible-playbook --syntax-check "$p"
          done

      - name: ansible-lint
        working-directory: ansible
        run: ansible-lint
