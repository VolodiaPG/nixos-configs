name: Ansible

on:
  push:
    paths:
      - "ansible/**"
      - ".github/workflows/ansible.yaml"
  pull_request:
    paths:
      - "ansible/**"
      - ".github/workflows/ansible.yaml"
  workflow_dispatch:

# This workflow covers the MIGRATED hosts only. deploy.yaml still builds and
# deploys home-server from the flake and must be left alone (PLAN.MD rule 1);
# its msi build/cachix job is removed in phase 7, not here.
jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@main

      - name: Install ansible
        run: pipx install ansible-core && pipx install ansible-lint

      - name: Syntax check
        working-directory: ansible
        run: |
          set -euxo pipefail
          for p in playbooks/*.yml; do
            ansible-playbook --syntax-check "$p"
          done

      - name: ansible-lint
        working-directory: ansible
        run: ansible-lint
