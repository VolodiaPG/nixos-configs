---
apiVersion: v1
kind: Service
metadata:
  name: freshrss
  namespace: development
spec:
  selector:
    app: freshrss
  ports:
    - protocol: TCP
      targetPort: 80
      port: 80
      nodePort: 30005
  type: NodePort
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: freshrss-data
  namespace: development
  labels:
    app: freshrss
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  claimRef:
    namespace: development
    name: freshrss-data
  hostPath:
    path: /data/freshrss
    type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: freshrss-data
  namespace: development
  labels:
    app: freshrss
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: freshrss-database
  namespace: development
  labels:
    app: freshrss
spec:
  instances: 1

  storage:
    size: 1Gi

  imageName: ghcr.io/cloudnative-pg/postgresql:18-standard-trixie

  resources:
    requests:
      memory: 50Mi
      cpu: 20m
    limits:
      memory: 100Mi
      cpu: 500m

  bootstrap:
    initdb:
      database: freshrss
      owner: freshrss
---
# Static volume on the host disk covered by restic (/data/backups).
apiVersion: v1
kind: PersistentVolume
metadata:
  name: freshrss-backup
  labels:
    app: freshrss
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  claimRef:
    namespace: development
    name: freshrss-backup
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - home-server
  local:
    path: /data/backups/freshrss
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: freshrss-backup
  namespace: development
  labels:
    app: freshrss
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ""
  volumeName: freshrss-backup
  resources:
    requests:
      storage: 5Gi
---
# Daily logical dump to the host; /data/backups is included in the restic backup.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: freshrss-database-dump
  namespace: development
  labels:
    app: freshrss
spec:
  schedule: "0 0 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          securityContext:
            runAsUser: 1001
            runAsGroup: 1001
            fsGroup: 1001
          restartPolicy: OnFailure
          containers:
            - name: dump
              image: ghcr.io/cloudnative-pg/postgresql:18-standard-trixie
              command:
                - sh
                - -ec
                - |
                  pg_dump --format=custom --file=/backup/freshrss-$(date +%F).dump
                  find /backup -name 'freshrss-*.dump' -mtime +7 -delete
              env:
                - name: PGHOST
                  value: freshrss-database-rw
                - name: PGDATABASE
                  value: freshrss
                - name: PGUSER
                  valueFrom:
                    secretKeyRef:
                      name: freshrss-database-app
                      key: username
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: freshrss-database-app
                      key: password
              volumeMounts:
                - name: backup
                  mountPath: /backup
          volumes:
            - name: backup
              persistentVolumeClaim:
                claimName: freshrss-backup
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: freshrss
  namespace: development
  labels:
    app: freshrss
data:
  TZ: "Europe/Paris"
  # Refresh feeds every 20 minutes
  CRON_MIN: "3,23,43"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: freshrss
  namespace: development
  labels:
    app: freshrss
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: freshrss
  template:
    metadata:
      labels:
        app: freshrss
    spec:
      containers:
        - name: freshrss
          image: freshrss/freshrss:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: 180Mi
              cpu: 10m
            limits:
              memory: 400Mi
              cpu: 1000m
          volumeMounts:
            - name: data
              mountPath: /var/www/FreshRSS/data
              subPath: data
            - name: data
              mountPath: /var/www/FreshRSS/extensions
              subPath: extensions
          envFrom:
            - configMapRef:
                name: freshrss
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: freshrss-database-app
                  key: username

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: freshrss-database-app
                  key: password

            # Automatic install on first start (ignored once data/config.php exists).
            # Authentication is delegated to the OIDC provider via HTTP auth.
            - name: FRESHRSS_INSTALL
              value: >-
                --api-enabled
                --base-url http://home-server:30005
                --db-type pgsql
                --db-host freshrss-database-rw:5432
                --db-base freshrss
                --db-user $(DB_USER)
                --db-password $(DB_PASSWORD)
                --auth-type http_auth
                --default-user admin
                --language en

            # Must match the preferred_username of the initial OIDC user
            - name: FRESHRSS_USER
              value: >-
                --user admin
                --language en

            # OIDC Configuration (handled by Apache mod_auth_openidc)
            - name: OIDC_ENABLED
              value: "1"

            - name: OIDC_PROVIDER_METADATA_URL
              value: "https://keycloak.goblin-alewife.ts.net/realms/master/.well-known/openid-configuration"

            - name: OIDC_CLIENT_ID
              value: "freshrss"

            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: freshrss-env
                  key: oidc_client_secret

            - name: OIDC_CLIENT_CRYPTO_KEY
              valueFrom:
                secretKeyRef:
                  name: freshrss-env
                  key: oidc_crypto_key

            # preferred_username can exceed FreshRSS' 38-char username limit
            # (e.g. user@github.idp.goblin-alewife.ts.net), so use the sub UUID.
            - name: OIDC_REMOTE_USER_CLAIM
              value: "sub"

            - name: OIDC_SCOPES
              value: "openid profile"

            #- name: OIDC_X_FORWARDED_HEADERS
            #  value: "X-Forwarded-Host X-Forwarded-Port X-Forwarded-Proto"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: freshrss-data
