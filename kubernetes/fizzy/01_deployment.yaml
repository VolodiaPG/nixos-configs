apiVersion: apps/v1
kind: Deployment
metadata:
  name: fizzy
  namespace: fizzy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fizzy
  template:
    metadata:
      labels:
        app: fizzy
    spec:
      containers:
        - name: commafeed
          image: ghcr.io/basecamp/fizzy:main
          ports:
            - containerPort: 8888
          volumeMounts:
            - name: fizzy-data
              mountPath: /rails/storage
          resources:
            requests:
              memory: 512Mi
              cpu: 250m
            limits:
              memory: 1Gi
          env:
            - name: BASE_URL
              value: https://fizzy.goblin-alewife.ts.net
            - name: MAILER_FROM_ADDRESS
              value: bot.volodia@gmail.com
            - name: DISABLE_SSL
              value: "true"
            - name: SMTP_ADDRESS
              value: smtp.gmail.com
            - name: SMTP_USERNAME
              value: bot.volodia@gmail.com
            - name: MALLOC_ARENA_MAX
              value: "2"
            - name: WEB_CONCURRENCY
              value: "2"
            - name: JOB_CONCURRENCY
              value: "2"
            - name: SECRET_KEY_BASE
              valueFrom:
                secretKeyRef:
                  name: fizzy-env
                  key: secret-key-base
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fizzy-env
                  key: smtp-password

      volumes:
        - name: fizzy-data
          persistentVolumeClaim:
            claimName: fizzy-pvc
