apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  source:
    repoURL: https://github.com/volodiapg/nixos-configs.git
    targetRevision: ansible
    path: kubernetes/gitops
    directory:
      recurse: false
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
