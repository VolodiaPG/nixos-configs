---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: freshrss-network-policy
  namespace: production
  labels:
    app: freshrss
  annotations:
    description: "Allows the pod to query the WWW"
spec:
  podSelector:
    matchLabels:
      app: freshrss
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 10.0.0.0/8 # Enterprise / Custom
              - 172.16.0.0/12 # Enterprise / Custom
              - 192.168.0.0/16 # local network
              - 100.64.0.0/10 # Tailnet
      ports:
        - protocol: TCP
          port: 443
