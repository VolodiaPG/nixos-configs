# Daily logical dump to the host; /data/backups is included in the restic backup.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: freshrss-database-dump
  namespace: production
  labels:
    app: freshrss
spec:
  schedule: "0 0 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 900
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app: freshrss-backup
        spec:
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            runAsUser: 1001
            runAsGroup: 1001
            fsGroup: 1001
          containers:
            - name: dump
              image: ghcr.io/cloudnative-pg/postgresql:18-standard-trixie@sha256:39add80f5b1e573e2f6b641c66fd1a2f8dede67ca0330e870285bc1078551390
              imagePullPolicy: IfNotPresent
              command:
                - sh
                - -ec
                - |
                  # Fresh pods are refused until the NetworkPolicy controller syncs their IP.
                  until pg_isready -q; do sleep 5; done
                  pg_dump --format=custom --file=/backup/freshrss.tmp.dump
                  mv /backup/freshrss.tmp.dump /backup/freshrss-$(date +%F).dump
              env:
                - name: PGHOST
                  valueFrom:
                    secretKeyRef:
                      name: freshrss-database-app
                      key: host
                - name: PGDATABASE
                  valueFrom:
                    secretKeyRef:
                      name: freshrss-database-app
                      key: dbname
                - name: PGUSER
                  valueFrom:
                    secretKeyRef:
                      name: freshrss-database-app
                      key: username
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: freshrss-database-app
                      key: password
              volumeMounts:
                - name: backup
                  mountPath: /backup
          volumes:
            - name: backup
              persistentVolumeClaim:
                claimName: freshrss-backup
