apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rss
  namespace: production
  labels:
    app: freshrss
  annotations:
    tailscale.com/proxy-group: ingress-proxies
    tailscale.com/tags: tag:k8s
spec:
  ingressClassName: tailscale
  tls:
    - hosts:
        - rss
  defaultBackend:
    service:
      name: freshrss
      port:
        number: 80
