apiVersion: v1
kind: PersistentVolume
metadata:
  name: fizzy-pv
  namespace: production
spec:
  capacity:
    storage: 10Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-storage
  local:
    path: /home/volodia/Documents/services/fizzy
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - home-server
  claimRef:
    namespace: production
    name: fizzy-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: fizzy-pvc
  namespace: production
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-storage
  resources:
    requests:
      storage: 10Gi
