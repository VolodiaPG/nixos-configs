apiVersion: v1
kind: PersistentVolume
metadata:
  name: idp-data
  namespace: production
  labels:
    app: idp
spec:
  capacity:
    storage: 200Mi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-storage
  local:
    path: /data/tsidp
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - home-server
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  labels:
    app: idp
  name: idp-data
  namespace: production
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-storage
  resources:
    requests:
      storage: 200Mi
