# Initial Keycloak admin. Keycloak reads it on first start only, the operator logs in with it.
apiVersion: k8s.bitwarden.com/v1
kind: BitwardenSecret
metadata:
  name: keycloak-admin
  namespace: production
  labels:
    app: keycloak
spec:
  organizationId: "49d1baa4-2d05-44af-b41b-b3d301759bbe"
  secretName: keycloak-admin
  onlyMappedSecrets: true # default is true
  map:
    - bwSecretId: REPLACE-WITH-BITWARDEN-SECRET-ID # keycloak-admin-username
      secretKeyName: username
    - bwSecretId: REPLACE-WITH-BITWARDEN-SECRET-ID # keycloak-admin-password
      secretKeyName: password
  authToken:
    secretName: bw-auth-token
    secretKey: token
