apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: keycloak
  namespace: production
  labels:
    app: keycloak
  annotations:
    # Allow direct access within the cluster
    tailscale.com/experimental-forward-cluster-traffic-via-ingress: "true"
    tailscale.com/proxy-group: ingress-proxies
    tailscale.com/tags: tag:k8s
spec:
  ingressClassName: tailscale
  tls:
    - hosts:
        - keycloak
  defaultBackend:
    service:
      name: keycloak-clusterip
      port:
        number: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: production
  labels:
    app: keycloak
  annotations:
    tailscale.com/tailnet-fqdn: "keycloak.goblin-alewife.ts.net"
    tailscale.com/proxy-group: "egress-proxies"
spec:
  type: ExternalName
  externalName: placeholder
  ports:
    - port: 443
      protocol: TCP
      name: https
