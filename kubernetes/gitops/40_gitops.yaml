apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gitops
  namespace: argocd
spec:
  destination:
    namespace: production
    server: https://kubernetes.default.svc
  project: production
  source:
    directory:
      recurse: true
    path: kubernetes/gitops/40_production
    repoURL: https://github.com/volodiapg/nixos-configs.git
    targetRevision: ansible
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
