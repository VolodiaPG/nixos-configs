apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tailscale-operator
  namespace: argocd
spec:
  project: production
  source:
    repoURL: https://pkgs.tailscale.com/helmcharts
    chart: tailscale-operator
    targetRevision: 1.104.4
    helm:
      releaseName: tailscale-operator
  destination:
    server: https://kubernetes.default.svc
    namespace: tailscale-operator
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
apiVersion: k8s.bitwarden.com/v1
kind: BitwardenSecret
metadata:
  name: operator-oauth-bw
  namespace: tailscale-operator
  labels:
    app: tailscale
spec:
  organizationId: "49d1baa4-2d05-44af-b41b-b3d301759bbe"
  secretName: operator-oauth
  onlyMappedSecrets: true # default is true
  map:
    - bwSecretId: 9b1730da-e77a-402f-82b7-b4f800e115ba # tailscale-client-id
      secretKeyName: client_id
    - bwSecretId: 9cd996ff-fd92-4f2b-8dd8-b4f800e1c658 # tailscale-client-secret
      secretKeyName: client_secret
  authToken:
    secretName: bw-auth-token
    secretKey: token
---
apiVersion: tailscale.com/v1alpha1
kind: ProxyGroup
metadata:
  name: ingress-proxies
spec:
  type: ingress
  replicas: 1
  tags:
    - tag:k8s
---
apiVersion: tailscale.com/v1alpha1
kind: ProxyGroup
metadata:
  name: egress-proxies
spec:
  type: egress
  replicas: 1
  tags:
    - tag:k8s
---
# Need to change the coredns config to use the new nameserver
apiVersion: tailscale.com/v1alpha1
kind: DNSConfig
metadata:
  name: ts-dns
spec:
  nameserver:
    image:
      repo: tailscale/k8s-nameserver
      tag: unstable
