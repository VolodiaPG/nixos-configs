apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tailscale-operator
  namespace: argocd
spec:
  project: production
  source:
    repoURL: https://pkgs.tailscale.com/helmcharts
    chart: tailscale-operator
    targetRevision: 1.104.4
    helm:
      releaseName: tailscale-operator
  destination:
    server: https://kubernetes.default.svc
    namespace: tailscale-operator
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
apiVersion: k8s.bitwarden.com/v1
kind: BitwardenSecret
metadata:
  name: operator-oauth-bw
  namespace: tailscale-operator
  labels:
    app: tailscale
    app.kubernetes.io/part-of: sm-operator
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/created-by: sm-operator
spec:
  organizationId: "49d1baa4-2d05-44af-b41b-b3d301759bbe"
  secretName: operator-oauth
  onlyMappedSecrets: true # default is true
  map:
    - bwSecretId: 9b1730da-e77a-402f-82b7-b4f800e115ba # tailscale-client-id
      secretKeyName: client_id
    - bwSecretId: 9cd996ff-fd92-4f2b-8dd8-b4f800e1c658 # tailscale-client-secret
      secretKeyName: client_secret
  authToken:
    secretName: bw-auth-token
    secretKey: token
---
