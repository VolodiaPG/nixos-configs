apiVersion: k8s.bitwarden.com/v1
kind: BitwardenSecret
metadata:
  name: tsidp-client
  namespace: production
  labels:
    app: keycloak
spec:
  organizationId: "49d1baa4-2d05-44af-b41b-b3d301759bbe"
  secretName: tsidp-client
  onlyMappedSecrets: true # default is true
  map:
    - bwSecretId: 94538412-919c-4ec9-8003-b4fa01329f17 # tsidp client id
      secretKeyName: client_id
    - bwSecretId: 26dee5d9-3373-4d7e-a1ba-b4fa0132b74a # tsidp client secret
      secretKeyName: client_secret
  authToken:
    secretName: bw-auth-token
    secretKey: token
