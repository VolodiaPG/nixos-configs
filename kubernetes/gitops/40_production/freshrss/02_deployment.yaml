apiVersion: apps/v1
kind: Deployment
metadata:
  name: freshrss
  namespace: production
  labels:
    app: freshrss
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: freshrss
  template:
    metadata:
      labels:
        app: freshrss
        netpol/allow-dns: "true"
        netpol/allow-tailscale-egress: "true"
        netpol/allow-www-egress: "true"
    spec:
      automountServiceAccountToken: false
      containers:
        - name: freshrss
          image: freshrss/freshrss:1.30.4@sha256:af44385229541bee24aa9148d0ff8f3b40e095373c63a2c0f74e09a27d3c59df
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: 180Mi
              cpu: 10m
            limits:
              memory: 400Mi
              cpu: 1000m
          securityContext:
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - SETUID
                - SETGID
                - DAC_OVERRIDE
                - NET_BIND_SERVICE
          volumeMounts:
            - name: data
              mountPath: /var/www/FreshRSS/data
              subPath: data
            - name: data
              mountPath: /var/www/FreshRSS/extensions
              subPath: extensions
            - name: config
              mountPath: /var/www/FreshRSS/data/config.php
              subPath: config.php
              readOnly: true
          startupProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 5
            failureThreshold: 30 # up to 150s for first-run install/migrations
          readinessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 30
            failureThreshold: 3
          envFrom:
            - configMapRef:
                name: freshrss
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: freshrss-database-app
                  key: username

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: freshrss-database-app
                  key: password

            # Read by data/config.php (see the freshrss-config ConfigMap).
            - name: FRESHRSS_SALT
              valueFrom:
                secretKeyRef:
                  name: freshrss-env
                  key: salt

            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: freshrss-env
                  key: oidc_client_secret

            - name: OIDC_CLIENT_CRYPTO_KEY
              valueFrom:
                secretKeyRef:
                  name: freshrss-env
                  key: oidc_crypto_key
      volumes:
        - name: config
          configMap:
            name: freshrss-config
        - name: data
          persistentVolumeClaim:
            claimName: freshrss-data
