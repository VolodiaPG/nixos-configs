apiVersion: k8s.bitwarden.com/v1
kind: BitwardenSecret
metadata:
  name: freshrss-env
  namespace: production
  labels:
    app: freshrss
spec:
  organizationId: "49d1baa4-2d05-44af-b41b-b3d301759bbe"
  secretName: freshrss-env
  onlyMappedSecrets: true # default is true
  map:
    - bwSecretId: 37dbe8f0-d859-4153-80e4-b4f800fbb967
      secretKeyName: oidc_client_secret
    - bwSecretId: 75cfbcb2-c035-4245-a332-b4f800fbd52f
      secretKeyName: oidc_crypto_key
  authToken:
    secretName: bw-auth-token
    secretKey: token
