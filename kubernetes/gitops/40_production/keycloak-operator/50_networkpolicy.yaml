apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: keycloak-operator
  namespace: production
  labels:
    app: keycloak-operator
  annotations:
    description: "keycloak-operator pod: egress to keycloak (DNS, kube-apiserver come from netpol/* labels)"
spec:
  podSelector:
    matchLabels:
      app: keycloak-operator
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: keycloak
      ports:
        - protocol: TCP
          port: 8080
