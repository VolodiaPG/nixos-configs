# Kyverno RBAC: policies below read tailscale/endpoints data and write ConfigMaps/NetworkPolicies.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kyverno:admission-controller:custom
  labels:
    rbac.kyverno.io/aggregate-to-admission-controller: "true"
rules:
  - apiGroups: ["tailscale.com"]
    resources: ["dnsconfigs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["endpoints"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kyverno:background-controller:custom
  labels:
    rbac.kyverno.io/aggregate-to-background-controller: "true"
rules:
  - apiGroups: ["tailscale.com"]
    resources: ["dnsconfigs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["endpoints"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create", "update", "patch", "delete", "get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["create", "update", "patch", "delete", "get", "list", "watch"]
---
# Keep the kube-system/coredns-custom stub zone for ts.net in sync with the
# tailscale DNSConfig nameserver IP.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: coredns-tailnet
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  # generateExisting: true
  rules:
    - name: coredns-custom-ts-net
      match:
        any:
          - resources:
              kinds:
                - tailscale.com/v1alpha1/DNSConfig
              names:
                - ts-dns
              operations:
                - CREATE
                - UPDATE
      preconditions:
        all:
          - key: "{{ request.object.status.nameserver.ip || '' }}"
            operator: NotEquals
            value: ""
      generate:
        apiVersion: v1
        kind: ConfigMap
        name: coredns-custom
        namespace: kube-system
        synchronize: true
        data:
          data:
            tailscale.server: |
              ts.net:53 {
                errors
                cache 30
                forward . {{ request.object.status.nameserver.ip }}
              }
---
# Allow pods labeled netpol/allow-kube-apiserver=true to reach only the
# real kube-apiserver addresses (from the default/kubernetes Endpoints).
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: allow-kube-apiserver
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  # generateExisting: true
  rules:
    - name: netpol-allow-kube-apiserver
      match:
        any:
          - resources:
              kinds:
                - Namespace
              names:
                - production
      context:
        - name: apiserver
          apiCall:
            urlPath: /api/v1/namespaces/default/endpoints/kubernetes
            jmesPath: "subsets[0]"
      generate:
        apiVersion: networking.k8s.io/v1
        kind: NetworkPolicy
        name: allow-kube-apiserver
        namespace: production
        synchronize: true
        data:
          metadata:
            annotations:
              description: "Opt-in by pod label netpol/allow-kube-apiserver=true: egress to kube-apiserver (generated by Kyverno)"
          spec:
            podSelector:
              matchLabels:
                netpol/allow-kube-apiserver: "true"
            policyTypes:
              - Egress
            egress:
              - to:
                  - ipBlock:
                      cidr: "{{ apiserver.addresses[0].ip }}/32"
                ports:
                  - protocol: TCP
                    port: 6443
                  - protocol: TCP
                    port: 443
