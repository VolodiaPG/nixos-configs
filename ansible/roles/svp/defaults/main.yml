---
# Defaults for the svp role. Do not duplicate anything from
# group_vars/all/main.yml here.

svp_install_dir: /opt/svp

# Runtime dependencies from https://www.svp-team.com/wiki/SVP:Linux.
# SVP bundles its own Qt, Python 3.12, VapourSynth and mpv (the archives
# below), so only these come from dnf. bsdtar unpacks the .7z archives.
svp_dnf_packages:
  - bsdtar
  - lsof # SVPManager finds running mpv instances with it
  - ocl-icd # OpenCL loader, for GPU-accelerated SVPflow
  - xcb-util-cursor # libxcb-cursor0 in the upstream docs
  - xdg-utils # add-menuitem.sh uses xdg-desktop-menu

# The components the official installer (svp4-linux.run) picks for
# "SVP + bundled mpv/VapourSynth + RIFE + TensorRT". Each one is a set of
# 7z archives in the installer's online repositories:
#   https://www.svp-team.com/files/repo/<repo>/<component>/<version><archive>
# Versions and SHA-1s come from each repo's Updates.xml and the
# <archive>.sha1 files next to the archives. To upgrade, re-read
#   https://www.svp-team.com/files/repo/{full,common}-lin64/Updates.xml?full=main
# and bump the matching rows. Order matters: later archives overwrite
# earlier ones, as the installer does.
#
# Left out on purpose: core.vlc (VLC plugin), core.manual, the SVPtube/
# SVPcode/SVPcast/SVPlight extensions, opt.ffmpeg and opt.mkvmerge.
# core.maintenance is the installer binary itself; without it SVPManager's
# built-in updater does nothing, and this list is the only upgrade path.
#
# opt.rife is RIFE on ncnn/Vulkan (any GPU). opt.rife_trt,
# opt.rife_trt.models and opt.rife_trt_base (1.4 GB of TensorRT libraries)
# are RIFE on TensorRT, which needs an NVIDIA RTX GPU (msi has an RTX 4070).
svp_archives:
  - { repo: full-lin64, component: core.full, version: "4.7.0.305-5", archive: libs.7z, sha1: 65097ac40c050335e601d3d5ce0beaf2268321c4 }
