---
# Defaults for the ssh_agent role. Do not duplicate anything from
# group_vars/all/main.yml here.
#
# SSH keys now live in ~/.ssh. Shells get an agent from keychain
# (chezmoi's 40-tools.zsh). This role only removes what the Bitwarden
# setup left behind.
ssh_agent_linux_units:
  - ssh-agent.service
  - ssh-agent.socket

# macOS only. Labels of the LaunchAgents that earlier versions installed.
ssh_agent_old_labels:
  - com.ansible.ssh-agent
  - com.ansible.ssh-auth-sock
