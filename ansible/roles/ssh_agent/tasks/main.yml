---
# ssh_agent: retire the Bitwarden SSH agent setup. See defaults/main.yml.

# Earlier versions masked these units. Unmask them so Plasma can start
# the OpenSSH agent again.
- name: ssh_agent | Linux | unmask OpenSSH's user ssh-agent
  when: ansible_system == 'Linux'
  become: true
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    scope: global
    masked: false
  loop: "{{ ssh_agent_linux_units }}"

- name: ssh_agent | macOS | retire old LaunchAgents
  when: ansible_system == 'Darwin'
  block:
    - name: ssh_agent | stop the old jobs
      ansible.builtin.command: "launchctl bootout gui/{{ ansible_user_uid }}/{{ item }}"
      loop: "{{ ssh_agent_old_labels }}"
      changed_when: true
      failed_when: false

    - name: ssh_agent | remove the old plists
      ansible.builtin.file:
        path: "{{ home_dir }}/Library/LaunchAgents/{{ item }}.plist"
        state: absent
      loop: "{{ ssh_agent_old_labels }}"
