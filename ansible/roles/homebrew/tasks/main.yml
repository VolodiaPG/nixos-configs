---
# homebrew: taps, formulae and casks for macOS.
#
# No-op on Linux hosts (guarded by the block `when` below) so this role can
# stay in playbooks/macos.yml only, or in a shared play, without blowing up
# on Nobara.
#
# Package lists live in inventory/group_vars/darwin.yml (brew_taps,
# brew_formulae, brew_casks) — see docs/migration/package-map.md §10.

- name: "homebrew | macOS package management"
  when: ansible_system == 'Darwin'
  block:
    - name: "homebrew | opt-in brew update (only when homebrew_update=true)"
      community.general.homebrew:
        update_homebrew: true
        path: "{{ homebrew_bin }}"
      when: homebrew_update | bool

    - name: "homebrew | tap external repositories"
      community.general.homebrew_tap:
        name: "{{ brew_taps }}"
        state: present
        path: "{{ homebrew_bin }}"
      when: brew_taps | length > 0

    - name: "homebrew | install formulae"
      community.general.homebrew:
        name: "{{ brew_formulae }}"
        state: present
        update_homebrew: false
        path: "{{ homebrew_bin }}"
      when: brew_formulae | length > 0

    - name: "homebrew | install casks"
      community.general.homebrew_cask:
        name: "{{ brew_casks }}"
        state: present
        path: "{{ homebrew_bin }}"
        # --adopt lets Homebrew take ownership of an app already sitting in
        # /Applications instead of hard-failing with "It seems there is
        # already an App at ...". That failure is fatal and aborts every
        # remaining cask, so without this one manually-installed app blocks
        # the whole list. Hit during the phase 6.1 migration with Zed, which
        # had been installed by its own updater. Homebrew only adopts when
        # the existing artifact matches what the cask would install, so this
        # cannot silently clobber an unrelated app. Harmless on a clean
        # machine, where there is nothing to adopt.
        install_options: "{{ homebrew_cask_install_options }}"
      when: brew_casks | length > 0
