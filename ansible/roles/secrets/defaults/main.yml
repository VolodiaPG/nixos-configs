---
# Defaults for the secrets role. Do not duplicate anything from
# group_vars/all/main.yml here.
#
# secrets: writes user-scope secrets, sourced from the vault, to the fixed
# dotfile paths they already live at today (PLAN.MD task 5.2: "so nothing
# downstream changes" — envvars.sh, etc. keep being read from ~ exactly as
# before, whether that ~ came from Nix/Home-Manager or this role).
#
# The vault itself (inventory/group_vars/all/vault.yml, ansible-vault
# encrypted) is EMPTY today — phase 5.2 only builds the mechanism. Task 5.1
# (docs/migration/secret-audit.md, written concurrently) is the audit of
# which secrets survive; a human does the one-time decrypt-and-re-encrypt
# dance documented in docs/migration/vault-setup.md. Until then every
# `vault_*` var below is undefined, and this role must skip cleanly rather
# than fail — see tasks/main.yml and the hard rule in PLAN.MD that
# `ansible-playbook --syntax-check` must keep passing throughout.
#
# Indirection layer, matching the pattern already established in
# roles/vpn/defaults/main.yml (tailscale_authkey: "{{ vault_tailscale_authkey
# | default('') }}"): every raw `vault_<x>` name is only ever referenced
# once, right here, behind a `| default('')` fallback. Everywhere else in
# this role (and in secrets_files below) uses the non-prefixed
# `secrets_<x>` name instead. That keeps exactly one place that has to know
# the vault var actually exists, and means a missing/undefined vault var
# degrades to an empty string instead of an Ansible "undefined variable"
# failure.
# default('', true), not default(''): the second argument also replaces a
# null. vault.yml carries `vault_envvars:` with no value, which YAML reads
# as null; plain default('') lets that through, and the role's
# `content | length` guard then crashes instead of skipping.
secrets_envvars: "{{ vault_envvars | default('', true) }}"

# secrets_files drives the whole role: one entry per user-scope secret file
# this role writes. Adding or removing a secret is meant to be a one-line,
# data-only change here — never a new task in tasks/main.yml.
#
# Fields:
#   name    - short label, used only in task names and debug output (never
#             written to disk, never logged as part of a secret value).
#   content - the decrypted value to write. Always a `secrets_<x>`
#             indirection var (see above), never `vault_<x>` directly, and
#             never a hardcoded value — this file is not vault.yml.
#   dest    - absolute destination path. Every entry here lives directly
#             under {{ home_dir }} because that is where these dotfiles
#             have always lived (pre-migration, via Home-Manager); moving
#             them would be a behaviour change this role isn't chartered
#             to make.
#   mode    - file mode. PLAN.MD is explicit: 0400 (owner read-only; no
#             write, no group/other access at all) for every secret this
#             role manages.
#
# Original PLAN.MD task 5.2 list had three files: ~/.envvars.sh,
# ~/.python-grid5000.yaml (pythong5k) and ~/.mail.inria.password.txt
# (mail.inria.password). The latter two were dropped by user decision
# during task 5.1's audit (see docs/migration/secret-audit.md, written
# concurrently, for the full disposition) — pythong5k and
# mail.inria.password are no longer needed anywhere. Only ~/.envvars.sh
# survives, so this list has exactly one entry today; it is still a list,
# not a single var, so a future secret only ever needs a new item here.
secrets_files:
  - name: envvars
    content: "{{ secrets_envvars }}"
    dest: "{{ home_dir }}/.envvars.sh"
    mode: "0400"
