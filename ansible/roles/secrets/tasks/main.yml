---
# secrets: vault-sourced files into place (PLAN.MD task 5.2). Driven
# entirely by secrets_files (defaults/main.yml) — see that file for the
# variable contract and for why only ~/.envvars.sh remains in the list.
#
# Runs on both Linux and Darwin (this role is in both playbooks/linux.yml
# and playbooks/macos.yml): {{ home_dir }} and {{ username }} already
# resolve per-OS via inventory/group_vars/all/main.yml, so nothing here is
# platform-conditional.
#
# Hard requirement (PLAN.MD): the vault is empty today, and
# `ansible-playbook --syntax-check` must keep passing regardless. That
# means this role must never `failed_when`/assert on a missing vault var —
# every entry with empty content is skipped with a debug message instead,
# not an error. Once inventory/group_vars/all/vault.yml is populated (see
# docs/migration/vault-setup.md) and `vault_password_file` is re-enabled in
# ansible.cfg, the same run starts writing the file for real without any
# change here.
#
# no_log: true on both tasks below: the `content` item itself is only ever
# the decrypted secret value (never referenced in a name/message), but
# no_log also suppresses Ansible's automatic "changed" diff output, which
# would otherwise print the full before/after file content to the console
# and to any log aggregator. ansible.builtin.copy (not template) is used
# deliberately — PLAN.MD is explicit that secret content is never rendered
# through Jinja templating on disk, only ever passed straight through as
# `content:`.
- name: "secrets | write {{ item.name }} ({{ item.dest }})"
  ansible.builtin.copy:
    content: "{{ item.content }}"
    dest: "{{ item.dest }}"
    owner: "{{ username }}"
    # user_group, not username: this role runs on Darwin too, where the
    # primary group is `staff` and no `volodia` group exists. See
    # inventory/group_vars/all/main.yml.
    group: "{{ user_group }}"
    mode: "{{ item.mode }}"
  no_log: true
  loop: "{{ secrets_files }}"
  loop_control:
    label: "{{ item.name }}"
  when: item.content | default('') | length > 0

- name: "secrets | {{ item.name }} not yet in the vault, skipping"
  ansible.builtin.debug:
    msg: >-
      {{ item.name }} has no content (its vault_* var is undefined or
      empty — the vault is empty until PLAN.MD task 5.1's surviving
      secrets are re-encrypted into inventory/group_vars/all/vault.yml;
      see docs/migration/vault-setup.md). Skipping {{ item.dest }}; this
      role will write it once the vault is populated and this play runs
      again.
  loop: "{{ secrets_files }}"
  loop_control:
    label: "{{ item.name }}"
  when: item.content | default('') | length == 0
