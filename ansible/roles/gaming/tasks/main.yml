---
# gaming: ported from modules/nixos/gaming.nix (PLAN.MD task 4.6).
#
# Nobara is a gaming-oriented distro and ships Steam, gamemode and
# mangohud; roles/pkgs (which runs earlier in playbooks/linux.yml) already
# installs everything gaming.nix lists (steam, gamemode, faugus-launcher —
# see defaults/main.yml for exactly where each one comes from). Reading
# gaming.nix line by line found no additional service, group, udev rule or
# config file beyond package installation and `programs.steam.enable`
# itself, which has no extra behaviour turned on in this repo's config.
#
# The one gap is the Steam library disk. /Games came from
# configurations/nixos/msi/hardware-configuration.nix, not gaming.nix, so
# the line-by-line read above missed it. It is the 166 G ext4 partition
# labelled `Games` on the Crucial SSD, which the reinstall preserved on
# purpose (PLAN.MD 6.2).

# Same device spec as NixOS: by label, so it survives the sda/sdb letter
# swaps documented in docs/migration/msi-cutover.md section 2. `nofail` is
# new: without it a missing or dead Crucial drops boot into emergency mode
# for a disk that only holds games.
- name: "gaming | mount the Steam library disk at /Games"
  become: true
  ansible.posix.mount:
    path: /Games
    src: LABEL=Games
    fstype: ext4
    opts: defaults,nofail
    state: mounted
  when: ansible_system == 'Linux'
