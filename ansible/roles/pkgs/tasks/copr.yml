---
# Task 3.1 — COPR (map §3: atim/starship, atim/lazygit, atim/bottom).
#
# community.general.copr supports check_mode and only flips the repo's
# enabled state when it isn't already what was asked for, so re-enabling
# an already-enabled repo reports no change.

- name: Enable COPR repositories
  community.general.copr:
    name: "{{ item }}"
    # Explicit, because the module derives the chroot from the distro fact.
    # On Nobara that gives nobara-44-x86_64, and COPR has no such chroot
    # ("Chroot nobara-44-x86_64 does not exist in atim/lazygit"). See
    # pkgs_copr_chroot in defaults/main.yml.
    chroot: "{{ pkgs_copr_chroot }}"
    # Only the packages this repo declares for the project. Nothing else
    # from a COPR can replace a Fedora or Nobara package on upgrade.
    includepkgs: "{{ copr_packages[item] }}"
    state: enabled
  become: true
  loop: "{{ copr_repos | default([]) }}"

- name: Install COPR-sourced packages
  ansible.builtin.dnf:
    name: "{{ copr_packages[item] }}"
    state: present
  become: true
  loop: "{{ copr_packages | default({}) | list }}"
  loop_control:
    label: "{{ item }}"
