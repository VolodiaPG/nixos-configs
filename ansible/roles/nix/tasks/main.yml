---
# roles/nix — Determinate Nix, retained only as a package manager for
# devenv/direnv/.envrc projects. See PLAN.MD Task 3.4 and "PHASE 2 — what
# it leaves behind", item 4.
#
# Safety: on macOS, nix-darwin is STILL the Nix installer/manager until
# PLAN.MD task 6.1 removes it. Running the Determinate installer while
# nix-darwin is active would fight nix-darwin for ownership of /nix and
# /etc/nix. Detect that state and skip entirely rather than proceed —
# this guard is the most important property of this role.

- name: "Nix-darwin guard | check for darwin-rebuild"
  ansible.builtin.command: command -v darwin-rebuild
  register: nix_darwin_rebuild_check
  changed_when: false
  failed_when: false
  # Read-only probe, so it runs in check mode too. Without this, --check
  # skips the command, and ansible-core still registers rc=0 for the
  # skipped task. The guard then reports nix-darwin present on a host
  # where it is gone, and the whole role is skipped in every dry run.
  check_mode: false
  when: ansible_system == 'Darwin'

- name: "Nix-darwin guard | check whether /run/current-system is a nix-darwin generation"
  ansible.builtin.stat:
    path: /run/current-system
  register: nix_darwin_current_system
  when: ansible_system == 'Darwin'

- name: "Nix-darwin guard | set fact"
  ansible.builtin.set_fact:
    nix_darwin_present: >-
      {{
        ansible_system == 'Darwin' and (
          (nix_darwin_rebuild_check.rc | default(1)) == 0
          or (nix_darwin_current_system.stat.lnk_source | default('')) is search('darwin-system')
        )
      }}

- name: "Nix-darwin guard | skip, nix-darwin still owns Nix on this host"
  ansible.builtin.debug:
    msg: >-
      Skipping roles/nix: nix-darwin is still managing the Nix install on
      this host (darwin-rebuild is on PATH and/or /run/current-system is a
      darwin-system generation). Do not run the Determinate installer here
      until nix-darwin has been removed (PLAN.MD task 6.1 — "macOS first").
  when: nix_darwin_present | default(false)

- name: Install and configure Determinate Nix
  when: not (nix_darwin_present | default(false))
  block:
    # Verified against the live install.determinate.systems/nix shell
    # wrapper (2026-09-24): the wrapper only downloads and execs the
    # `nix-installer` binary with "$@" — it does not interpret any flags
    # itself. Flags below go to `nix-installer install`:
    #   --determinate  enables Determinate Nix (PLAN.MD's command)
    #   --no-confirm   required for non-interactive runs; PLAN.MD's command
    #                  as written omits it and would hang waiting on a TTY
    #                  prompt under Ansible.
    # become: the installer must run as root. Without it, nix-installer
    # tries to escalate by itself via `sudo`, which cannot prompt under
    # Ansible ("sudo: a terminal is required to read the password"). Found
    # on the first run against the fresh Nobara install; the macbook never
    # reached this task because Nix was already present there.
    - name: Install Nix via the Determinate installer
      become: true
      ansible.builtin.shell: |
        set -o pipefail
        curl -fsSL {{ nix_installer_url }} | sh -s -- install --no-confirm --determinate
      args:
        executable: /bin/sh
        # `creates` alone is the installed-check. It used to be paired with
        # `command -v nix`, which asks the wrong question: whether nix is on
        # *Ansible's* PATH. On the macbook after darwin-uninstaller, Nix is
        # installed but not on PATH (see the /etc/zshrc task below), and
        # that check would have re-run the installer over a live install.
        creates: "{{ nix_marker_bin }}"

    # The installer puts this exact block (same markers, same body — copied
    # from /nix/receipt.json's configure_shell_profile action) into
    # /etc/zshrc. nix-darwin then took /etc/zshrc over, and
    # darwin-uninstaller restored the pristine macOS file WITHOUT it — so
    # after 6.1 step 2 no local zsh had nix on PATH. /etc/zshenv still
    # carries the installer's SSH-only hook, which is why it looked fine
    # over ssh. Managing it here also makes a fresh install idempotent: the
    # markers match what the installer writes, so this is a no-op there.
    - name: Ensure zsh sources nix-daemon.sh (/etc/zshrc)
      ansible.builtin.blockinfile:
        path: /etc/zshrc
        marker: "# {mark}"
        marker_begin: Nix
        marker_end: End Nix
        block: |
          if [ -e '/nix/var/nix/profiles/default/etc/profile.d/nix-daemon.sh' ]; then
              . '/nix/var/nix/profiles/default/etc/profile.d/nix-daemon.sh'
          fi
      become: true

    - name: Ensure /etc/nix exists
      ansible.builtin.file:
        path: /etc/nix
        state: directory
        owner: root
        group: "{{ root_group }}"
        mode: "0755"
      become: true

    # Determinate Nix regenerates /etc/nix/nix.conf itself and !includes
    # nix.custom.conf for overrides (confirmed from a live install's
    # nix.conf header: "do not modify! this file will be replaced!").
    # Writing to nix.conf directly would be clobbered on the next
    # Determinate upgrade, so we only ever touch nix.custom.conf.
    - name: Write /etc/nix/nix.custom.conf (substituters, keys, trusted-users)
      ansible.builtin.template:
        src: nix.custom.conf.j2
        dest: "{{ nix_custom_conf_path }}"
        owner: root
        group: "{{ root_group }}"
        mode: "0644"
      become: true

    # The GitHub access token, kept out of the 0644 nix.custom.conf above
    # and written to its own 0600 fragment that nix.custom.conf !includes.
    # copy + content (never template) and no_log, matching roles/secrets:
    # the content IS the secret, so it must never be rendered through Jinja
    # on disk or echoed in a changed-diff. Skipped cleanly while the vault
    # is empty — `!include` tolerates the missing file, so a half-applied
    # state is harmless rather than a broken nix.conf.
    - name: Write the Nix GitHub access-token fragment
      ansible.builtin.copy:
        content: "access-tokens = {{ nix_access_tokens }}\n"
        dest: "{{ nix_access_tokens_path }}"
        owner: root
        group: "{{ root_group }}"
        mode: "0600"
      become: true
      no_log: true
      when: nix_access_tokens | length > 0

    - name: Nix access token not yet in the vault, skipping
      ansible.builtin.debug:
        msg: >-
          vault_access_token is undefined or empty, so
          {{ nix_access_tokens_path }} was not written. nix.custom.conf
          !includes it regardless, which Nix tolerates when the file is
          absent; GitHub fetches just fall back to the unauthenticated
          60/hour rate limit until the vault is populated (see
          docs/migration/vault-setup.md).
      when: nix_access_tokens | length == 0

    # nix-direnv half of PHASE-2 item 4: make sure a real nix-direnv exists
    # again in the managed user's Nix profile. The other half — repointing
    # direnv's global direnvrc away from the broken, hardcoded-store-path
    # ~/.config/direnv/lib/hm-nix-direnv.sh at ~/.nix-profile/share/nix-direnv/direnvrc
    # — is chezmoi's: chezmoi/dot_config/direnv/lib/nix-direnv.sh sources
    # what this installs.
    - name: Check whether nix-direnv is already in {{ username }}'s Nix profile
      # Absolute path: become's environment does not source nix-daemon.sh,
      # so a bare `nix` is not on PATH there on either platform.
      ansible.builtin.command: "{{ nix_marker_bin }} profile list"
      become: true
      become_user: "{{ username }}"
      register: nix_profile_list
      changed_when: false
      failed_when: false
      when: nix_install_nix_direnv | default(true)

    - name: Install nix-direnv into {{ username }}'s Nix profile
      ansible.builtin.command: "{{ nix_marker_bin }} profile add {{ nix_direnv_package }}"
      become: true
      become_user: "{{ username }}"
      when: >-
        (nix_install_nix_direnv | default(true))
        and 'nix-direnv' not in (nix_profile_list.stdout | default(''))
