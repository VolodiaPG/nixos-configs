---
# Defaults for the desktop_linux role. Do not duplicate anything from
# group_vars/all/main.yml here.

# Task 3.3 (fonts). font_packages itself lives in
# group_vars/desktop.yml (shared with macbook; see that file's comment for
# why). This default is only a safety net so fonts.yml doesn't fail with an
# undefined variable if group_vars is ever skipped (e.g. ansible-playbook
# run with --limit against a stray inventory).
font_packages: []

# Comic Code Ligatures — licensed, paid font. User decision (2026-09-24):
# option (a) — stays under transcrypt in the repo, Ansible installs it to
# ~/.local/share/fonts at apply time. Never copied into the chezmoi source
# tree. Read from the CONTROL NODE, so playbook_dir is the right anchor.
comic_code_src_dir: "{{ playbook_dir }}/../../persistent/home/volodia/.local/share/fonts/comicode"
comic_code_dest_dir: "{{ home_dir }}/.local/share/fonts"
# Set false only to deliberately apply on a control node where the repo is
# transcrypt-locked; the monospace fontconfig default will not resolve.
comic_code_required: true

# Task 4.4 (kanata, ex modules/nixos/desktop.nix `services.kanata`). Config
# source lives at the repo root (not under ansible/), shipped to the host
# as-is; see tasks/kanata.yml for why concurrent-tap-hold is enabled on the
# deployed copy rather than in the repo file.
kanata_config_src: "{{ playbook_dir }}/../../static/kanata.lisp"
kanata_config_path: "{{ home_dir }}/.config/kanata/kanata.lisp"
kanata_unit_path: "{{ home_dir }}/.config/systemd/user/kanata.service"
# terra's kanata package (group_vars/nobara.yml dnf_packages), installed
# under the native-first policy. It was a nix-profile path before.
kanata_bin_path: /usr/bin/kanata
