---
- name: Configure macOS hosts
  hosts: darwin
  gather_facts: true
  roles:
    - nix
    - homebrew
    # After homebrew: roles/syncthing runs the Homebrew syncthing binary.
    - ssh_agent
    - syncthing
    # After homebrew (node, claude-code@latest).
    - claude_wrapper
    - pkgs
    - shell
    - darwin_defaults
    - secrets
    - chezmoi
