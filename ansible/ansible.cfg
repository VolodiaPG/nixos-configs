[defaults]
inventory = inventory/hosts.yml
roles_path = roles
# Re-enable in phase 4, once the vault actually has contents. Ansible hard-
# fails EVERY command (even --syntax-check) when this points at a file that
# does not exist, which would make the scaffold unverifiable today.
# vault_password_file = ~/.config/ansible/vault-pass
host_key_checking = True
# NOT `stdout_callback = yaml`: that resolved to community.general.yaml, which
# was removed in community.general 12.0.0. This is the supported replacement.
stdout_callback = default
result_format = yaml
interpreter_python = auto_silent
nocows = True

[ssh_connection]
pipelining = True
