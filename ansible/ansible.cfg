[defaults]
inventory = inventory/hosts.yml
roles_path = roles
# Enabled in phase 5, now that inventory/group_vars/all/vault.yml has real
# content and ~/.config/ansible/vault-pass exists (mode 0600). Ansible hard-
# fails EVERY command (even --syntax-check) when this points at a file that
# does not exist, so if you clone this repo onto a new control node, create
# that file first — see docs/migration/vault-setup.md.
vault_password_file = ~/.config/ansible/vault-pass
host_key_checking = True
# NOT `stdout_callback = yaml`: that resolved to community.general.yaml, which
# was removed in community.general 12.0.0. This is the supported replacement.
stdout_callback = default
result_format = yaml
interpreter_python = auto_silent
nocows = True

[ssh_connection]
pipelining = True
