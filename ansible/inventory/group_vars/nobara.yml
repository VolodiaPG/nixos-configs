---
# Package names verified against fedora:43 — see docs/migration/package-map.md.
# Populated in phase 3. Keep these lists in the same grouping as the map so
# rows can be lifted across without re-deciding anything.
#
# Font packages (Inter, IBM Plex, Noto CJK — map §1b) are intentionally
# NOT listed here; another agent owns fonts (task 3.3) and consumes its
# own list. `papirus-icon-theme` is an icon theme, not a font, so it stays.
#
# `com.brave.Browser` is filed under the map's §5 "nix" heading, but its
# own `source` column and notes say `flatpak` (flathub API 200) — this
# looks like a miscategorisation in the map itself. Treated here as a
# flatpak, per the source column, not per the section heading. See the
# task 3.1 report for the full discrepancy writeup.
#
# The two `determinate-nix` / `determinate-nixd` map rows are the Nix
# installer itself (task 3.4, `roles/nix`), not `nix profile install`
# packages, so they are not carried into nix_profile_packages here.

# §1 fedora main repo + §1b new rows (RPM names, alphabetised).
dnf_packages:
  - alsa-utils
  - brightnessctl
  - cargo
  - chezmoi
  - ddcutil
  - difftastic
  - direnv
  - distrobox
  - docker-compose
  - earlyoom # §1b — task 4.2
  - easyeffects
  - fail2ban
  - filezilla
  - firewalld # §1b — replaces networking.firewall, task 4.4
  - fzf
  - gamemode # Nobara likely already ships this — verify before applying (task 4.6)
  - gcc
  - gdu
  - gimp
  - git
  - git-crypt
  - glibc-langpack-fr # §1b — fr_FR.UTF-8, task 4.2
  - gnupg2 # §1b — pairs with pinentry-tty
  - golang # name differs from nixpkgs `go`; map lists host as "mac (+msi dev)" — kept for msi's dev toolchain, see report
  - gparted
  - grc
  - htop
  - i2c-tools # §1b — ddcutil prerequisite + i2c group/udev rule, task 4.4
  - inkscape
  - jq
  - just
  - kde-connect # name differs from nixpkgs `kdeconnect-kde`
  - kernel-tools # name differs from nixpkgs `cpupower` — cpupower ships in kernel-tools
  - kitty
  - libgtop2 # name differs from nixpkgs `libgtop`
  - libnotify
  - lm_sensors # underscore, not hyphen
  - lsof
  - make # name differs from nixpkgs `gnumake`
  - mangohud # §1b — Nobara likely already ships this — verify before applying (task 4.6)
  - mkpasswd
  - moby-engine # name differs from nixpkgs `docker`
  - moreutils
  - mosh
  - neovim
  - nmap
  - nodejs-bash-language-server # name differs from nixpkgs `bash-language-server`
  - papirus-icon-theme # §1b — base icon theme; Catppuccin folder recolour is nix_profile_packages
  - parallel
  - pavucontrol-qt
  - pinentry-tty # §1b — pairs with gnupg2
  - podman
  - podman-compose
  - python3
  - qbittorrent
  - qpwgraph
  - qt6-qttools # name differs from nixpkgs `qttools`
  - ripgrep
  - ShellCheck # capital S, as in nixpkgs
  - shfmt
  - syncthing
  - tailscale
  - tmux
  - vim-enhanced # name differs from nixpkgs `vim`
  - wget2-wget # name differs from nixpkgs `wget`; Fedora 43 default is wget2
  - wl-clipboard
  - zathura
  - zathura-plugins-all # pairs with zathura
  - zoxide
  - zsh
  # From Nobara's own repos, not RPM Fusion / COPR — see
  # rpmfusion_packages and copr_repos below for why.
  - mpv
  - steam
  # terra, moved from nix_profile_packages under the native-first policy.
  # kanata's user unit points at /usr/bin/kanata (roles/desktop_linux).
  - kanata
  # For caveman (roles/claude_wrapper installs it with npm). Before this,
  # node was only on msi as a dependency of another package.
  # Fedora 44 ships node as versioned packages (nodejs22*); these are the
  # ones already installed. Do NOT use `nodejs`/`nodejs-npm`: on Nobara they
  # resolve to the nobara repo's fc43 build, whose files collide with
  # nodejs22's ("file /usr/lib64/libnode.so.127 ... conflicts"), and that
  # aborts the whole dnf transaction.
  - nodejs22
  - nodejs22-npm
  - t3code
  - typstyle
  - bottom
  - starship
  # Sourced by chezmoi's ~/.config/zsh/20-completion.zsh from /usr/share.
  # zsh-completions has no Fedora 43 package; zsh's own completions cover it.
  - zsh-autosuggestions

# §2 rpmfusion. `roles/pkgs` enables the free+nonfree repos idempotently
# before these are installed.
# Empty on purpose. Verified on the installed msi (Nobara 44, 2026-09-26):
# Nobara does not enable RPM Fusion, and its own repos already carry mpv
# (nobara) and steam (terra), plus its own ffmpeg and mesa-*-freeworld
# builds (nobara-pikaos-additional). Adding RPM Fusion would give those
# packages a second source, and dnf could swap Nobara's builds for RPM
# Fusion's on a later upgrade. mpv and steam are in dnf_packages instead.
# roles/pkgs enables the RPM Fusion repos only when this list is
# non-empty.
rpmfusion_packages: []

# §3 copr:<repo>. The map chose atim/{bottom,lazygit,starship} because
# none of the three is in Fedora main. On Nobara 44, bottom and starship
# are already in terra, which Nobara enables by default, so they are in
# dnf_packages. A COPR copy would only compete with terra's. lazygit is in
# no enabled repo, so its COPR stays; atim/lazygit has a fedora-44-x86_64
# build (copr API, 2026-09-26).
#
# Native-first (user decision, 2026-09-26): COPR is also used where it
# replaces a nix-profile package. Each project below was checked for a
# fedora-44-x86_64 build of the exact package, read from the project's own
# repodata. roles/pkgs enables every COPR with includepkgs set to that
# project's list here, so a multi-package COPR such as nyk/tools cannot
# shadow Fedora or Nobara packages on a later upgrade. These are personal
# COPRs, i.e. third-party builds.
copr_repos:
  - atim/lazygit
  - nyk/tools
  - ecomaikgolf/typst
  - sfaulken/Catppuccin

copr_packages:
  "atim/lazygit":
    - lazygit
  "nyk/tools":
    - texlab # 5.26.0, /usr/bin/texlab
  "ecomaikgolf/typst":
    - tinymist # 0.15.2, /usr/bin/tinymist
  # Mauve cursors for the chezmoi look-and-feels
  # (dot_local/share/plasma/look-and-feel/Catppuccin-*-Mauve), which name
  # these theme dirs. Upstream catppuccin/cursors 2.0.0 lower-cased them to
  # catppuccin-<flavor>-mauve-cursors. The same COPR also has
  # catppuccin-*-splash-theme, deliberately NOT installed: it ships
  # look-and-feel IDs identical to chezmoi's, and those already contain
  # their own splash.
  "sfaulken/Catppuccin":
    - catppuccin-latte-cursors-mauve
    - catppuccin-mocha-cursors-mauve
    # Required by the -mauve subpackages ("requires
    # catppuccin-<flavor>-cursors = 2.0.0-1.fc44"). They must be listed, or
    # includepkgs hides them and dnf fails to resolve. They ship no theme
    # directory of their own. No other COPR here has an in-repo dependency
    # (checked in the repodata).
    - catppuccin-latte-cursors
    - catppuccin-mocha-cursors

# §4 flatpak. Consumed by the flatpak-role agent's flatpak.yml.
flatpak_remotes:
  - name: flathub
    url: https://flathub.org/repo/flathub.flatpakrepo
flatpak_packages:
  - app.legcord.Legcord
  - com.brave.Browser # see the header note — map files this under §5 "nix" but its own source column says flatpak
  - dev.zed.Zed
  - io.github.Faugus.faugus-launcher
  - io.github.nokse22.high-tide
  - org.signal.Signal
  - com.bitwarden.desktop

# §5 nix — Determinate Nix profile installs, only where no RPM exists.
# Excludes com.brave.Browser (see above) and the determinate-nix/nixd
# installer rows (task 3.4, not a profile package).
# Policy (user decision, 2026-09-26): native packages first. Anything that
# a Nobara repo (fedora/nobara/terra) packages is in dnf_packages, not
# here. kanata, t3code and typstyle moved out on that basis. What remains
# has no usable Nobara package or COPR (see the comment on each entry).
# Moved out:
#   kanata, t3code, typstyle -> dnf_packages (terra)
#   texlab, tinymist, catppuccin cursors -> copr_packages
#   claude-code, codegraph, rtk -> upstream_installers (their official
#     install scripts)
# Dropped:
#   notify-desktop -> libnotify's notify-send covers it
#   catppuccin-kde -> never provided the Mauve assets as declared (the
#     package defaults to Frappe/Blue). The colour schemes, aurorae and
#     look-and-feels (with their own splash) come from chezmoi.
#   catppuccin-papirus-folders -> nothing references Papirus (the icon
#     themes are Fluent-purple-dark / breeze-dark)
#   graphite-cursors -> referenced only by the dropped Hyprland modules
nix_profile_packages:
  - devenv # Nix-native; the reason Nix is kept (§0)
  - nixd # Nix-native
  - nixfmt-rfc-style # Nix-native
  - lua-language-server # terra's is not on PATH (/usr/libexec only)
  - stylua # no Fedora/terra package, no COPR with a Fedora 44 build
  - prettierd # no Fedora/terra package, no COPR
  - shellharden # no Fedora/terra package, no COPR
  - distrobox-tui # no Fedora/terra package, no COPR

# Official upstream install scripts, run as the user by roles/pkgs
# (tasks/upstream.yml). Each is skipped once its `creates` path exists; the
# tools then update themselves. Used where no Nobara package exists and the
# project publishes its own installer.
upstream_installers:
  - claude-code
  - codegraph
  - rtk

# chezmoi_modify_manager (map §6 `upstream`) is not a dnf/copr/flatpak/nix
# package — it is installed from a GitHub release tarball by `roles/pkgs`
# per docs/migration/kde-cutover.md. See defaults/main.yml in that role
# for the pinned version and asset name.
