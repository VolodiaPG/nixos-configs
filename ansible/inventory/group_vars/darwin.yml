---
# See PLAN.MD §3.1 and docs/migration/package-map.md §10.
#
# Cask count discrepancy (see task 3.1 report): three places in the repo
# disagree about the cask count — this file's old comment said 13
# (11-entry intersection + kitty + zed), PLAN.MD's §3.1 example homebrew
# block lists 12 tokens, and the map's own §10a header says "12 entries".
# Resolved against the map's §10a *table*, which is the verified artifact
# (every token checked with `brew info` on 2026-09-23): the table actually
# lists 13 rows — the 8-way intersection, plus steam/calibre/qbittorrent
# (§0.2 explicit keeps, 11 total), plus kitty (carried regardless per the
# map's own note), plus zed (added by §0). The map's own "12 entries"
# header undercounts its table by one (it forgets to count zed, which is
# "listed separately below" in the same paragraph). 13 is correct.
# Third-party taps. roles/homebrew taps these before installing, which
# matters: claudeusagebar does not exist in homebrew/cask, so without this
# the cask install fails on a fresh machine with "No available cask".
# Verified against the live prefix during the phase 6.1 Homebrew adoption
# (`brew list --full-name` shows exactly two non-core packages):
#   artzainnn/tap      -> claudeusagebar  (managed, in brew_casks below)
#   nirs/vmnet-helper  -> vmnet-helper    (NOT declared: phase 3 abandoned
#                                          vmnet-helper; the tap is left
#                                          installed but unmanaged so it
#                                          lapses rather than being restored)
# jurplel/tap is also tapped on the macbook but provides nothing that is
# actually installed — a dead tap, deliberately not carried over.
brew_taps:
  - artzainnn/tap

# §10b — the CLI tooling Home Manager provided. chezmoi is included here
# (task 3.1 requires chezmoi on macOS too; it becomes the replacement for
# the nix-darwin-provided chezmoi once nix-darwin is removed in task 6.1).
brew_formulae:
  # ansible drives this entire migration, so the tool that applies the
  # config has to be part of the config — otherwise a rebuilt macbook
  # cannot run the playbook that rebuilds it. Already installed here;
  # declared in phase 6.1 after `brew leaves` turned it up as undeclared.
  - ansible
  # Native-first policy (user decision, 2026-09-26). Both had come from Home
  # Manager and lapsed with it. rtk was later reinstalled from brew by hand
  # but never declared; nixfmt had not come back at all.
  - rtk
  # For caveman (roles/claude_wrapper installs it with npm). Before this,
  # node was only here as a dependency.
  - node
  - nixfmt
  # Also undeclared and deliberately left that way, from the same
  # `brew leaves` diff: mole, ollama, and nirs/vmnet-helper/vmnet-helper.
  # Same treatment as the casks above — installed here, never installed or
  # removed by Ansible, so they lapse on a rebuild. vmnet-helper was already
  # covered by the phase 3 note on its tap further up.
  # pam-reattach restores TouchID sudo inside tmux/screen. common-darwin.nix
  # got this from nix-darwin's pam module, which baked an absolute /nix/store
  # path into /etc/pam.d/sudo_local; that path rots the moment the derivation
  # is GC'd. Homebrew gives a stable prefix instead. roles/darwin_defaults
  # references it as {{ darwin_defaults_pam_reattach_path }}.
  - pam-reattach
  - ripgrep
  - fzf
  - direnv
  - zoxide
  - starship
  - lazygit
  - difftastic
  - chezmoi
  - gdu
  - grc
  - mosh
  - just
  - keychain
  - tmux
  - neovim
  - git
  - git-crypt
  - make
  - go
  - gopls
  - rust
  - ruff
  # rustfmt is deliberately absent: Homebrew lists it as an *oldname* of the
  # `rust` formula, not a formula of its own, so declaring both makes
  # community.general.homebrew fail with "Package names for rust are missing
  # or ambiguous: rust, rustfmt". `rust` above already provides the rustfmt
  # binary. (Fedora does ship a separate rustfmt package — see
  # docs/migration/package-map.md line 95 — so this is a macOS-only removal.)
  - stylua
  - shfmt
  - shellcheck
  - shellharden
  - prettierd
  - bash-language-server
  - lua-language-server
  - texlab
  - tinymist
  - typstyle
  - jq
  - htop
  - nmap
  # GNU parallel is deliberately absent on macOS: Homebrew declares
  # "parallel Conflicts with: moreutils (because both install a `parallel`
  # executable)", and the two cannot be installed together. moreutils wins
  # because it is load-bearing — modules/home/tmux.nix:14 pulls it in
  # explicitly for `sponge`, which tmux.nix:81 uses in a tmux-resurrect
  # post-save hook. pkgs.parallel (common-home.nix:119) has no user
  # anywhere in the repo. Nix could ship both (separate store paths);
  # Homebrew cannot. Fedora packages moreutils' copy as
  # parallel-moreutils, so Linux keeps both — this is a macOS-only removal.
  # If GNU parallel is ever wanted here, install it and run
  # `brew link --overwrite parallel`: that takes the `parallel` name while
  # leaving moreutils' sponge/ts/chronic/vipe linked.
  - wget
  - moreutils
  - bottom
  - libgtop
  - lsof
  - python@3.13
  - mpv
  - syncthing
  - terminal-notifier
  - fswatch
  # Home Manager's zsh plugins (~/.zsh/plugins/, store symlinks). chezmoi's
  # ~/.config/zsh/20-completion.zsh already sources them from
  # /opt/homebrew/share, but nothing installed them there — missed in the
  # original package port because programs.zsh plugins are not packages in
  # home.packages. Found in phase 6.1 while scripting the HM removal.
  - zsh-autosuggestions
  - zsh-completions
  - podman
  - podman-compose
  - texinfo
  - bc
  - findutils
  # Required by this repo's own commit hook: .git/crypt/transcrypt calls
  # `nproc`, which macOS lacks. GNU coreutils used to reach PATH through
  # nix-darwin's system profile, undeclared anywhere, so the dependency
  # stayed invisible until darwin-uninstaller removed it and every commit
  # failed with "nproc: command not found". Homebrew installs commands macOS
  # does not ship (nproc among them) unprefixed in /opt/homebrew/bin, and
  # the ones macOS does ship only as g-prefixed names, so this adds nproc
  # without shadowing BSD stat/ls/date. Do not add gnubin to PATH.
  - coreutils

# §10a — the fixed cask set: 8-way intersection + steam/calibre (§0.2
# explicit keeps) + kitty (carried regardless, not a §0.2 dispute) + zed
# (added by §0). The map's §10a table lists 13, but qbittorrent is one of
# them and is unavailable on macOS (see below), so 12 are installable.
brew_casks:
  - karabiner-elements
  - tg-pro
  - bettermouse
  - betterdisplay
  - tidal
  - signal
  - vlc
  - parsec
  - steam
  - calibre
  # - qbittorrent
  #   BLOCKED UPSTREAM, not a config error. Homebrew disabled this cask on
  #   2026-09-01: "Cask 'qbittorrent' has been disabled because it does not
  #   pass the macOS Gatekeeper check!" A disabled cask is a hard error, so
  #   leaving it declared fails the whole homebrew role and every cask after
  #   it. DECIDED phase 6.1: leave it out on macOS. No replacement, no
  #   c0re100-qbittorrent fork cask, no out-of-band .dmg. Kept as a comment
  #   rather than deleted so the reason survives and nobody re-adds it from
  #   the §10a table below. msi is unaffected and still installs qbittorrent
  #   from Fedora.
  - kitty
  - zed
  # Installed on the macbook but absent from this list until now (found by
  # diffing `brew list --cask` against it during phase 6.1). Adopted on the
  # user's explicit instruction.
  - brave-browser
  - docker-desktop
  - claudeusagebar
  - legcord
  # Native-first (user decision, 2026-09-26): Claude Code from Homebrew.
  # The chezmoi wrapper ~/.local/bin/claude finds it on PATH. It is the
  # @latest channel because that is what was already installed by hand,
  # and Homebrew refuses `claude-code` alongside it ("Cask 'claude-code'
  # conflicts with 'claude-code@latest'").
  - claude-code@latest
  # DELIBERATELY NOT DECLARED, decided phase 6.1 from the same
  # `brew list --cask` diff: alt-tab and hiddenbar. Both are installed on
  # the macbook and are being left UNMANAGED rather than uninstalled —
  # roles/homebrew only ever installs, never removes, so they survive here
  # and simply do not come back on a rebuilt machine. mouseless was in this
  # group too and has since been uninstalled by hand, outside Ansible.
  # Listed only so the next diff does not read as an oversight.

# Nix-native tools with no Homebrew formula (native-first policy,
# 2026-09-26). roles/pkgs installs them with `nix profile add`. Both came
# from Home Manager and have been missing since it was removed.
nix_profile_packages:
  - devenv
  - nixd

# Official upstream installer where Homebrew has nothing. codegraph was
# already installed by hand with this same script; declaring it makes a
# rebuilt macbook get it too.
upstream_installers:
  - codegraph
