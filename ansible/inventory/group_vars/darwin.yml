  - make
  - go
  - gopls
  - rust
  - ruff
  - rustfmt
  - stylua
  - shfmt
  - shellcheck
  - shellharden
  - prettierd
  - bash-language-server
  - lua-language-server
  - texlab
  - tinymist
  - typstyle
  - jq
  - htop
  - nmap
  - parallel
  - wget
  - moreutils
  - bottom
  - libgtop
