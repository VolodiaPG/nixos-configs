---
# home-server is deliberately absent. It stays on NixOS (PLAN.MD rule 1).
# Do not add it.
#
# msi is addressed by its BARE Tailscale name, not the FQDN: the control
# node's known_hosts records msi's keys under the short name only, so
# msi.goblin-alewife.ts.net fails host-key verification even though both
# names serve byte-identical keys. Do not paper over this with
# host_key_checking = False.
all:
  children:
    linux:
      hosts:
        msi:
          ansible_host: msi
    nobara:
      hosts:
        msi: {}
    darwin:
      hosts:
        macbook:
          ansible_connection: local
    desktop:
      hosts:
        msi: {}
        macbook: {}
